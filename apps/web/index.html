<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="#09090b" name="theme-color" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=2" />
    <link rel="shortcut icon" href="/icons/favicon-32x32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KameHouse</title>
    <meta name="description" content="Self-hosted, user-friendly media server for anime." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KameHouse" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link href="/manifest.json" rel="manifest" />
    <style>
        body { margin: 0; background-color: #09090b; -webkit-font-smoothing: antialiased; }
        @keyframes ball-bounce {
            0%, 80%, 100% {
                transform: translateY(0) scale(0.85);
                opacity: 0.4;
            }
            40% {
                transform: translateY(-12px) scale(1.1);
                opacity: 1;
            }
        }
        .loading-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b 60%, #b45309 100%);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.65), 0 0 6px rgba(251, 191, 36, 0.9);
            animation: ball-bounce 1.4s ease-in-out infinite;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        .loading-dot:nth-child(3) { animation-delay: 0s; }
    </style>
</head>

<body>
    <div id="global-loader" style="background-color: #09090b; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; overflow: hidden; z-index: 9999; transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); user-select: none;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1.75rem;">
            <h1 style="color: white; font-size: 2.25rem; font-family: 'Outfit', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; line-height: 1; margin: 0 0 0 0.3em; font-weight: 900; text-shadow: 0 0 28px rgba(245,158,11,0.3);">KAMEHOUSE</h1>
            
            <!-- 3 Pelotas de Dragon Ball cargando -->
            <div style="display: flex; align-items: center; gap: 12px; height: 32px;">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>

            <span id="global-loader-text" style="font-family: monospace; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: #71717a; margin-top: -0.5rem;">Iniciando KameHouse...</span>
        </div>
    </div>
<div id="root"></div>
</body>

</html>
