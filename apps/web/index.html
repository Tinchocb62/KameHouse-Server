        body { margin: 0; background-color: #09090b; }

<body>

            <div style="position: absolute; width: 75%; height: 75%; border-radius: 9999px; background: radial-gradient(circle, rgba(255,160,0,0.2) 0%, transparent 70%); filter: blur(10px); animation: pulse 2s ease-in-out infinite;"></div>

<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
