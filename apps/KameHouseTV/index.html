<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>KameHouse TV</title>
</head>
<body>
    <div id="root"></div>
    <script type="text/javascript">
        // Load Tizen WebAPIS dynamically to prevent parser-blocking or hanging issues on non-Tizen environments or during boot
        (function() {
            if (typeof window.tizen !== 'undefined' || navigator.userAgent.indexOf('Tizen') > -1) {
                var script = document.createElement('script');
                script.src = '$WEBAPIS/webapis/webapis.js';
                script.async = true;
                document.head.appendChild(script);
                document.documentElement.classList.add('is-tizen');
            }
        })();
    </script>
</body>
</html>
